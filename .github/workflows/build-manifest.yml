name: Build posts manifest

on:
  push:
    branches: [main]
    paths:
      - 'posts/**.md'
      - 'generate-manifest.js'
      - '.github/workflows/build-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: shani8dev/shani-ci-commons/.github/workflows/build.yml@main
    with:
      build-type: manifest
