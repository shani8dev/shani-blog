<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blog</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
  <link rel="manifest" href="/manifest.json">

  <!-- ═══ GitHub Pages SPA 404 redirect ════════════════════════════════
       Encodes the current path + query + hash into the index page URL so
       the SPA router on index.html can restore it.
       This is the ONLY script needed in 404.html — no CSS, no heavy libs.
  ════════════════════════════════════════════════════════════════════ -->
  <script>
    (function () {
      var ua = navigator.userAgent || '';
      // FIX G (ported from docs.shani.dev): broader bot regex catches
      // Google-InspectionTool and other Google crawlers whose UA doesn't
      // contain the literal string "googlebot".
      // FIX H: anthropic-ai and ChatGPT-User carry neither "bot" nor
      // "crawler"/"spider" in their UA string, so this regex used to miss
      // them — and robots.txt's own `Disallow: /*?p=` then trapped them on
      // the very redirect this file sends unrecognized visitors to. Both
      // are explicitly welcomed in robots.txt, so they must be recognized
      // here too.
      var isBot = /bot|crawler|spider|google|bingbot|yandex|baidu|facebookexternalhit|twitterbot|linkedinbot|slackbot|anthropic-ai|chatgpt-user/i.test(ua);

      // NEVER redirect search/social bots — let them see the real 404
      if (isBot) return;

      var l = window.location;
      var path   = l.pathname;
      var search = l.search ? l.search.slice(1) : '';
      var hash   = l.hash   ? l.hash.slice(1)   : '';
      var redirect = l.protocol + '//' + l.hostname +
        (l.port ? ':' + l.port : '') + '/' +
        '?p=' + encodeURIComponent(path) +
        (search ? '&q=' + encodeURIComponent(search) : '') +
        (hash   ? '&h=' + encodeURIComponent(hash)   : '');
      l.replace(redirect);
    })();
  </script>

  <!-- Apply saved theme before redirect fires to prevent any flash.
       Wrapped in try/catch — localStorage can throw in Safari private
       browsing or with storage blocked by an extension; without the guard
       an exception here means data-theme never gets set before the
       redirect, causing a one-frame flash of the wrong theme. -->
  <script>
    (function () {
      try {
        var pfx = (typeof CONFIG !== 'undefined' && CONFIG.STORAGE_PREFIX) ? CONFIG.STORAGE_PREFIX : 'shani';
        var t = localStorage.getItem(pfx + '_theme') ||
                (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <!-- Page is immediately redirected by the script above.
       This fallback is only visible if JS is completely disabled. -->
  <noscript>
    <div style="text-align:center;padding:4rem 2rem;font-family:sans-serif">
      <strong>JavaScript is required to view this blog.</strong>
    </div>
  </noscript>
</body>
</html>
